<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Balerco — Lugares mágicos, seguros y divertidos">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBB03B"/><stop offset="1" stop-color="#F26B21"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FFF6EC"/>
  <circle cx="980" cy="120" r="360" fill="#FDEEDD"/>

  <!-- sol -->
  <circle cx="1010" cy="150" r="70" fill="#FFC61E"/>
  <!-- colina -->
  <path d="M0 500 Q 400 420 700 480 T 1200 470 L1200 630 L0 630 Z" fill="#43B54A"/>
  <path d="M0 545 Q 500 480 1200 545 L1200 630 L0 630 Z" fill="#37A03E"/>

  <!-- tobogán -->
  <g>
    <rect x="820" y="330" width="20" height="180" rx="10" fill="#16223B"/>
    <rect x="930" y="290" width="20" height="220" rx="10" fill="#16223B"/>
    <rect x="805" y="312" width="160" height="28" rx="13" fill="#1FA6E0"/>
    <path d="M828 340 C 828 420, 760 440, 760 512 L 800 512 C 800 460, 866 440, 866 342 Z" fill="#F6851F"/>
  </g>

  <!-- texto -->
  <text x="90" y="150" font-family="Poppins, Verdana, sans-serif" font-weight="800" font-size="88" fill="url(#brand)">Balerco</text>
  <path d="M92 172 C 200 190, 320 190, 400 172" stroke="#1FA6E0" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="90" y="300" font-family="Poppins, Verdana, sans-serif" font-weight="700" font-size="72" fill="#16223B">Creamos lugares</text>
  <text x="90" y="378" font-family="Poppins, Verdana, sans-serif" font-weight="700" font-size="72" fill="#16223B">mágicos, seguros</text>
  <text x="90" y="456" font-family="Poppins, Verdana, sans-serif" font-weight="700" font-size="72" fill="#F6851F">y divertidos</text>
  <text x="92" y="540" font-family="Poppins, Verdana, sans-serif" font-weight="600" font-size="30" fill="#16223B">Parques infantiles · Gimnasios biosaludables · Bogotá</text>
</svg>
